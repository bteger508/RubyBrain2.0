name: "brain"

services:
  rails-app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
    - ..:/workspaces/RubyBrain2.0:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Uncomment the next line to use a non-root user for all processes.
    # user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
    depends_on:
    - selenium
    - postgres

  selenium:
    image: selenium/standalone-chromium
    restart: unless-stopped

  postgres:
    # pgvector's image is stock postgres plus the vector extension, which
    # Recall's semantic search needs.
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    networks:
    - default
    volumes:
    # Postgres 18's image keeps its data in a major-version subdirectory, so the
    # mount goes one level up from the 17-and-earlier /var/lib/postgresql/data.
    - postgres-data:/var/lib/postgresql
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres

volumes:
  postgres-data:
